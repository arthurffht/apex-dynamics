name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, types, physics, build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        shell: pwsh
        run: ./scripts/bootstrap.ps1
      - name: Verify project
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Upload sandbox and reusable library
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apex-dynamics-development-build
          path: |
            build/ApexDynamicsSandbox.rbxlx
            build/ApexDynamics.rbxm
            .local/generated/BuildInfo.luau
            .local/generated/source-snapshot.json
            .local/build-receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
